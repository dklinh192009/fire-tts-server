<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Báo Cháy Thông Minh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; text-align: center; border-bottom: 2px solid #ffcdd2; padding-bottom: 10px; }
        
        /* Bảng danh sách ESP32 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #ffebee; color: #c62828; }
        .status-online { color: #2e7d32; font-weight: bold; }
        .status-offline { color: #757575; font-style: italic; }
        
        /* Các Nút bấm */
        button { border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-edit { background-color: #1976d2; color: white; }
        .btn-edit:hover { background-color: #1565c0; }
        .btn-save { background-color: #d32f2f; color: white; font-size: 16px; width: 100%; padding: 15px; margin-top: 15px; }
        .btn-save:hover { background-color: #b71c1c; }
        .btn-back { background-color: #9e9e9e; color: white; margin-bottom: 20px; }
        
        /* Trang điều khiển (ẩn mặc định) */
        #detail-page { display: none; }
        .input-group { margin-top: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        
        #current-device-name { color: #1976d2; }
    </style>
</head>
<body>

<div class="container">
    <div id="dashboard-page">
        <h1>🔥 Bảng Điều Khiển Báo Cháy</h1>
        <p>Danh sách các thiết bị ESP32 đã kết nối:</p>
        <table>
            <thead>
                <tr>
                    <th>Tên Thiết Bị (ID)</th>
                    <th>Vị Trí Hiện Tại</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="device-list">
                <tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="detail-page">
        <button class="btn-back" onclick="goBack()">🔙 Quay lại danh sách</button>
        <h1>Cài Đặt Vị Trí</h1>
        <p>Đang cấu hình cho thiết bị: <strong id="current-device-name">...</strong></p>
        
        <div class="input-group">
            <label for="location-input">Nhập vị trí đặt loa báo cháy:</label>
            <input type="text" id="location-input" placeholder="Ví dụ: Tầng 3 - Phòng Kế Toán">
        </div>
        
        <button class="btn-save" onclick="saveLocation()">💾 Lưu và Tải xuống ESP32</button>
    </div>
</div>

<script>
    let currentEditingDevice = "";

    // Hàm lấy dữ liệu từ Server và vẽ ra bảng
    async function loadDevices() {
        try {
            const response = await fetch('/clients');
            const data = await response.json();
            
            const tbody = document.getElementById('device-list');
            tbody.innerHTML = ''; // Xóa chữ đang tải

            // Nếu không có ai online và cũng chưa lưu ai
            if (data.online.length === 0 && Object.keys(data.locations).length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Chưa có thiết bị nào kết nối</td></tr>';
                return;
            }

            // Gộp danh sách thiết bị online và thiết bị đã từng lưu vị trí
            const allDevices = new Set([...data.online, ...Object.keys(data.locations)]);

            allDevices.forEach(deviceID => {
                const isOnline = data.online.includes(deviceID);
                const loc = data.locations[deviceID] || "Chưa thiết lập";
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${deviceID}</strong></td>
                    <td>${loc}</td>
                    <td class="${isOnline ? 'status-online' : 'status-offline'}">
                        ${isOnline ? '🟢 Online' : '⚪ Offline'}
                    </td>
                    <td>
                        <button class="btn-edit" onclick="openEditPage('${deviceID}', '${loc}')">✏️ Cài đặt</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Lỗi khi tải dữ liệu:", error);
        }
    }

    // Chuyển sang trang Cài đặt
    function openEditPage(deviceID, currentLocation) {
        currentEditingDevice = deviceID;
        document.getElementById('current-device-name').innerText = deviceID;
        
        // Nếu đã có vị trí thì điền sẵn vào ô nhập
        const inputField = document.getElementById('location-input');
        inputField.value = currentLocation !== "Chưa thiết lập" ? currentLocation : "";

        // Chuyển đổi hiển thị
        document.getElementById('dashboard-page').style.display = 'none';
        document.getElementById('detail-page').style.display = 'block';
    }

    // Quay lại danh sách
    function goBack() {
        document.getElementById('detail-page').style.display = 'none';
        document.getElementById('dashboard-page').style.display = 'block';
        loadDevices(); // Load lại bảng cập nhật mới
    }

    // Gửi dữ liệu xuống Server (và từ Server xuống ESP32)
    async function saveLocation() {
        const newLocation = document.getElementById('location-input').value.trim();
        
        if (!newLocation) {
            alert("Vui lòng nhập vị trí!");
            return;
        }

        try {
            const response = await fetch('/updateLocation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceID: currentEditingDevice, location: newLocation })
            });

            const result = await response.json();
            
            if (result.success) {
                alert(`✅ Thành công! Đã gửi vị trí "${newLocation}" tới ${currentEditingDevice}`);
                goBack(); // Tự động quay lại danh sách
            } else {
                alert("❌ Có lỗi xảy ra, vui lòng thử lại.");
            }
        } catch (error) {
            alert("❌ Không thể kết nối tới Server.");
        }
    }

    // Lần đầu mở web sẽ load danh sách ngay, và cứ 5s làm mới 1 lần để xem trạng thái online/offline
    loadDevices();
    setInterval(loadDevices, 5000);
</script>

</body>
</html>
